name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest

  mujoco-sim:
    # Separate job so the fast pure-NumPy `test` job above never waits on this.
    # Covers the optional `sim` extras (mujoco, imageio, pillow) used by
    # apps/palletizing_cell.py and apps/pick_and_place_mujoco.py, and proves
    # MuJoCo can actually render headlessly on the runner (no display/GPU).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install OS packages for headless MuJoCo rendering (osmesa)
        run: |
          sudo apt-get update
          # libgl1-mesa-glx was dropped in Ubuntu 24.04 and the hosted runner
          # moved, which broke this build without a line of code changing.
          # libgl1 plus libglx-mesa0 are the packages that replaced it.
          sudo apt-get install -y libosmesa6-dev libgl1 libglx-mesa0 libglfw3
      - name: Install dependencies (dev + sim)
        run: uv sync --group dev --group sim
      - name: Headless MuJoCo render smoke test
        # MUJOCO_GL=osmesa: software (CPU) offscreen rendering, no Xvfb/GPU needed.
        env:
          MUJOCO_GL: osmesa
        run: |
          uv run python - <<'PY'
          import mujoco
          import numpy as np

          xml = """
          <mujoco>
            <worldbody>
              <light diffuse="0.5 0.5 0.5" pos="0 0 3"/>
              <geom type="plane" size="1 1 0.1" rgba="0.8 0.8 0.8 1"/>
              <body pos="0 0 0.5">
                <joint type="free"/>
                <geom type="box" size="0.1 0.1 0.1" rgba="1 0 0 1"/>
              </body>
            </worldbody>
          </mujoco>
          """
          model = mujoco.MjModel.from_xml_string(xml)
          data = mujoco.MjData(model)
          mujoco.mj_forward(model, data)

          renderer = mujoco.Renderer(model, height=64, width=64)
          renderer.update_scene(data)
          pixels = renderer.render()

          assert pixels is not None, "renderer.render() returned None"
          assert pixels.size > 0, "renderer.render() returned an empty array"
          assert np.any(pixels != 0), "rendered frame is all zeros (osmesa isn't actually rendering)"
          print(f"MuJoCo offscreen render OK: shape={pixels.shape}, dtype={pixels.dtype}")
          PY
      - name: Run test suite (with sim extras installed)
        # Runs the full suite, not just the MuJoCo-specific files, so
        # tests/test_palletizing_cell.py and tests/test_ur5e_mujoco.py are
        # picked up here rather than silently no-opping.
        #
        # ARMIK_REQUIRE_MUJOCO turns "mujoco is missing, so skip" into a
        # failure. Everywhere else that skip is right. In the one job whose
        # entire purpose is to install the sim extras, a skip would mean the
        # FK cross-validation had quietly stopped running and the accuracy
        # claim in the README was unchecked again.
        env:
          MUJOCO_GL: osmesa
          ARMIK_REQUIRE_MUJOCO: "1"
        run: uv run pytest
